[package]
name        = "deshredder"
version     = "0.1.0"
edition     = "2024"
description = "Pure Solana shred assembler library — zero I/O, zero async deps"
license     = "MIT"

[lib]
name = "deshredder"
path = "src/lib.rs"

[dependencies]
# agave-unstable-api makes solana_ledger::shred pub (instead of pub(crate)).
# Same feature used by solana-gossip, so colibri's full dep tree shares one rocksdb.
solana-ledger = { git = "https://github.com/anza-xyz/agave.git", tag = "v4.3.0", features = ["agave-unstable-api"] }
solana-entry  = { git = "https://github.com/anza-xyz/agave.git", tag = "v4.3.0" }

# agave 4.3.0 serialises `Entry` with wincode instead of serde. Pinned to the
# version agave's Cargo.lock resolves; wincode is byte-compatible with bincode,
# so the emitted gRPC payload does not change.
wincode = "0.6.1"
bincode       = "1"

# Pin leaf crates to exact agave v3.1.5 workspace versions to prevent Cargo
# from resolving to newer crates.io releases that have a broken five8 dep chain.
solana-keypair   = "=3.1.2"
solana-signature = { version = "=3.5.2", default-features = false }

[dev-dependencies]
solana-hash = "=4.6.0"
